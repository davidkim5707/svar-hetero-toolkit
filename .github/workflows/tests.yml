name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  zero-restriction-tests:
    # MathWorks licenses MATLAB on GitHub-hosted runners for public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Self-tests of the zero-restriction routines
        uses: matlab-actions/run-command@v2
        with:
          command: run('tests/run_tests.m')

  hars-example:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Statistics_and_Machine_Learning_Toolbox
      - name: HARS example on the oil model, start to finish
        uses: matlab-actions/run-command@v2
        with:
          command: run('examples/ex01_hars_oil.m')
      - uses: actions/upload-artifact@v4
        with:
          name: ex01_hars_oil_figure
          path: examples/output/ex01_hars_oil.pdf
